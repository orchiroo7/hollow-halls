name: Deploy to GitHub Pages

# Publishes docs/ - the web build of Hollow Halls 2.5D - on every push to main.
# configure-pages turns Pages on the first time it runs, using the token the
# workflow is given, so nothing has to be switched on by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Turn Pages on if it is not already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Take docs/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
